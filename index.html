<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>获得黑客问卷调查</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }
        .box {
            width: 90%;
            max-width: 380px;
            background: #fff;
            padding: 35px 28px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        .title {
            font-size: 20px;
            margin-bottom: 18px;
            color: #222;
        }
        .question {
            font-size: 15px;
            color: #555;
            margin-bottom: 22px;
            line-height: 1.6;
            text-align: left;
        }
        .option-item {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 12px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            position: relative; /* 为了给半透明遮罩层定位 */
        }
        .option-item:hover {
            background: #f1f8e9;
            border-color: #81c784;
        }

        /* 被选中时的背景图样式 */
        .option-item.selected {
            background: transparent;
            color: #222;
            border-color: #81c784;

            /* 这里记得改成你真实的图片名字，比如 'minecraft.png' */
            background-image: url('bg.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* 半透明遮罩，防止背景图太深看不清字 */
        .option-item.selected::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.6); 
            z-index: -1;
            border-radius: 10px;
        }

        #submit {
            width: 100%;
            height: 46px;
            background: #0288d1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* 视频全屏样式 */
        .scare-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 9999;
        }
        video {
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .hidden { display: none !important; }
        .no-cursor { cursor: none !important; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="box" id="questionBox">
        <div class="title">你拥有其他的黑客吗</div>
        <div class="question"></div>
        <div class="option-item" data-val="A">A. 有</div>
        <div class="option-item" data-val="B">B. 没有</div>
        <div class="option-item" data-val="C">C. 不知道</div>        
        <button id="submit">提交答案</button>
    </div>

    <div id="video-wrap" class="scare-container hidden">
        <video id="video" src="video.mp4" loop playsinline></video>
    </div>

    <script>
        const submit = document.getElementById('submit');
        const questionBox = document.getElementById('questionBox');
        const videoWrap = document.getElementById('video-wrap');
        const video = document.getElementById('video');
        const options = document.querySelectorAll('.option-item');
        let selected = null;

        // 选项点击选中
        options.forEach(opt => {
            opt.onclick = () => {
                options.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selected = opt.dataset.val;
            }
        });

        // 全屏函数
        function tryFullScreen() {
            const el = document.documentElement;
            const rfs = el.requestFullscreen || el.webkitRequestFullScreen || el.mozRequestFullScreen || el.msRequestFullscreen;
            if (rfs) rfs.call(el).catch(()=>{});
        }

        // 无论选哪个，提交直接跳转
        submit.onclick = function() {
            questionBox.classList.add('hidden');
            videoWrap.classList.remove('hidden');
            document.body.classList.add('no-cursor');

            video.play().catch(()=>{
                video.muted = true;
                video.play();
            });
            tryFullScreen();
        }

        // 离开页面拦截
        window.onbeforeunload = () => "确定要离开吗？离开此网页你将无法获得牛逼的黑客客户端。";
    </script>
</body>
</html>
