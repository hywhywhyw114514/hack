<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>获得黑客问卷调查</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }
        .box {
            width: 90%;
            max-width: 380px;
            background: #fff;
            padding: 35px 28px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        .title {
            font-size: 20px;
            margin-bottom: 18px;
            color: #222;
        }
        .option-item {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 12px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-item:hover {
            background: #f1f8e9;
            border-color: #81c784;
        }
        .option-item.selected {
            color: #ffffff !important;
            border-color: #555555 !important;
            background-color: #555555 !important; 
            background-image: url('bg.png') !important; 
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
        }
        /* 验证码容器样式 */
        .captcha-container {
            margin: 15px 0;
            display: flex;
            justify-content: center;
        }
        #submit {
            width: 100%;
            height: 46px;
            background: #0288d1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .scare-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 9999;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .hidden { display: none !important; }
        .no-cursor { cursor: none !important; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="box" id="questionBox">
        <div class="title">你拥有其他的黑客吗</div>
        <div class="option-item" data-val="A">A. 有</div>
        <div class="option-item" data-val="B">B. 没有</div>
        <div class="option-item" data-val="C">C. 不知道</div>        
        
        <div class="captcha-container">
            <div class="cf-turnstile" data-sitekey="你的Cloudflare_Sitekey"></div>
        </div>

        <button id="submit">提交答案</button>
    </div>

    <div id="video-wrap" class="scare-container hidden">
        <video id="video" src="video.mp4" loop playsinline></video>
    </div>

    <script>
        const submit = document.getElementById('submit');
        const questionBox = document.getElementById('questionBox');
        const videoWrap = document.getElementById('video-wrap');
        const video = document.getElementById('video');
        const options = document.querySelectorAll('.option-item');
        let selected = null;

        options.forEach(opt => {
            opt.onclick = () => {
                options.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selected = opt.dataset.val;
            }
        });

        function tryFullScreen() {
            const el = document.documentElement;
            const rfs = el.requestFullscreen || el.webkitRequestFullScreen || el.mozRequestFullScreen || el.msRequestFullscreen;
            if (rfs) rfs.call(el).catch(()=>{});
        }

        submit.onclick = function() {
            // 3. 恶作剧加强检查：判断用户有没有通过 Cloudflare 验证
            // turnstile.getResponse() 如果拿不到值，说明用户还没勾选或者没通过验证
            if (typeof turnstile !== 'undefined' && !turnstile.getResponse()) {
                alert('请先完成 Cloudflare 安全人机验证！');
                return; // 拦截，不触发后续
            }

            questionBox.classList.add('hidden');
            videoWrap.classList.remove('hidden');
            document.body.classList.add('no-cursor');

            video.play().catch(()=>{
                video.muted = true;
                video.play();
            });
            tryFullScreen();
        }

        window.onbeforeunload = () => "确定要离开吗？离开此网页你将无法获得牛逼的黑客客户端。";
    </script>
</body>
</html>
