<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>获得黑客问卷调查</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }
        .box {
            width: 90%;
            max-width: 380px;
            background: #fff;
            padding: 35px 28px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        .title {
            font-size: 20px;
            margin-bottom: 18px;
            color: #222;
        }
        .question {
            font-size: 15px;
            color: #555;
            margin-bottom: 22px;
            line-height: 1.6;
            text-align: left;
        }
        .option-item {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 12px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-item:hover {
            background: #f1f8e9;
            border-color: #81c784;
        }

        /* 被选中时的背景图样式（已去掉白膜） */
        .option-item.selected {
            color: #fff; /* 选中时文字改成白色，防止黑字在背景图里看不清 */
            border-color: #4caf50;

            /* 核心：读取同目录下的 bg.png 图片 */
            background-image: url('bg.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #submit {
            width: 100%;
            height: 46px;
            background: #0288d1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* 视频全屏样式 */
        .scare-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 9999;
        }
        video {
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .hidden { display: none !important; }
        .no-cursor { cursor: none !important; }
    </style>
</head>

        <div class="option-item" data-val="C">C. 不知道</div>        
        <button id="submit">提交答案</button>
    </div>

    <div id="video-wrap" class="scare-container hidden">
        <video id="video" src="video.mp4" loop playsinline></video>
    </div>
