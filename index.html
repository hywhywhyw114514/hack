<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MaceAura - 点击进入</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }
        /* 初始白色面板 + 大字提示 */
        .start-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        .start-panel h1 {
            font-size: 2.5rem;
            color: #333;
            text-align: center;
            padding: 20px;
            letter-spacing: 2px;
            font-weight: 500;
            text-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        /* 视频容器（初始隐藏） */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 5;
            display: none;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 全屏后隐藏鼠标 */
        .no-cursor {
            cursor: none !important;
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <!-- 初始白色面板 -->
    <div id="startPanel" class="start-panel">
        <h1> 点击任意地方打开 MaceAura浏览器ui </h1>
    </div>

    <!-- 视频容器（初始隐藏） -->
    <div id="videoContainer" class="video-container">
        <video id="video" src="video.mp4" loop playsinline></video>
    </div>

    <script>
        (function() {
            const startPanel = document.getElementById('startPanel');
            const videoContainer = document.getElementById('videoContainer');
            const video = document.getElementById('video');

            let activated = false; // 防止重复激活

            function enterFullscreen() {
                const el = document.documentElement;
                const requestFullscreen = el.requestFullscreen || el.webkitRequestFullScreen || el.mozRequestFullScreen || el.msRequestFullscreen;
                if (requestFullscreen) {
                    requestFullscreen.call(el).catch(err => {
                        console.warn("全屏失败:", err);
                    });
                }
            }

            function startExperience() {
                if (activated) return;
                activated = true;

                // 隐藏白色面板
                startPanel.style.display = 'none';
                // 显示视频容器
                videoContainer.style.display = 'block';

                // 播放视频（由于是用户点击触发，可以正常播放有声视频）
                video.play().catch(() => {
                    // 如果因自动策略失败（极少情况），静音重试
                    video.muted = true;
                    video.play();
                });

                // 进入全屏
                enterFullscreen();

                // 全屏后隐藏鼠标
                document.body.classList.add('no-cursor');
            }

            // 任意点击（包括触摸）触发
            window.addEventListener('click', startExperience);
            // 键盘任意键也触发（提升体验）
            window.addEventListener('keydown', startExperience, { once: false });
            // 避免重复绑定导致多次触发，但 startExperience 内有 activated 开关无副作用
        })();
    </script>
</body>
</html>
