<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>安全验证 - 获得黑客问卷调查</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #ffffff; /* 初始状态给纯白，模仿官方验证环境 */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
            transition: background 0.5s ease;
        }

        /* 🔒 初始验证盒子 */
        .verification-wrap {
            text-align: center;
            padding: 20px;
        }
        .cf-notice {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* 📝 选择题区域（初始强制隐藏） */
        .box {
            width: 90%;
            max-width: 380px;
            background: #fff;
            padding: 35px 28px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        .title {
            font-size: 20px;
            margin-bottom: 18px;
            color: #222;
        }
        .option-item {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 12px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-item:hover {
            background: #f1f8e9;
            border-color: #81c784;
        }
        .option-item.selected {
            color: #ffffff !important;
            border-color: #555555 !important;
            background-color: #555555 !important; 
            background-image: url('bg.png') !important; 
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
        }
        #submit {
            width: 100%;
            height: 46px;
            background: #0288d1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* 🎬 视频全屏样式 */
        .scare-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 9999;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* 辅助类 */
        .hidden { display: none !important; }
        .no-cursor { cursor: none !important; }
    </style>
</head>

        </div>
    </div>

        <div class="option-item" data-val="A">A. 有</div>
        <div class="option-item" data-val="B">B. 没有</div>
        <div class="option-item" data-val="C">C. 不知道</div>        
        <button id="submit">提交答案</button>
    </div>

    <div id="video-wrap" class="scare-container hidden">
        <video id="video" src="video.mp4" loop playsinline></video>
    </div>
